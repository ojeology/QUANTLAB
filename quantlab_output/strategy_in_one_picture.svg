<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="960" height="660" fill="#f8fafc"/>
  <text x="480" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Your $2,000, as a machine</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#64748b">The whole strategy in one picture — no jargon</text>

  <!-- A: your money -->
  <rect x="380" y="96" width="200" height="66" rx="12" fill="#0f172a"/>
  <text x="480" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">$2,000</text>
  <text x="480" y="147" text-anchor="middle" font-size="12" fill="#cbd5e1">your money, always yours</text>

  <!-- split arrows -->
  <line x1="480" y1="162" x2="480" y2="192" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="192" x2="255" y2="218" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="192" x2="705" y2="218" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="247,216 263,216 255,228" fill="#94a3b8"/>
  <polygon points="697,216 713,216 705,228" fill="#94a3b8"/>

  <!-- B1: coins lent out -->
  <rect x="80" y="228" width="350" height="122" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="255" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">① Buy 20 famous coins — LEND them out</text>
  <text x="255" y="280" text-anchor="middle" font-size="13" fill="#334155">Traders betting "price will fall" must borrow coins.</text>
  <text x="255" y="300" text-anchor="middle" font-size="13" fill="#334155">They borrow yours — and pay you rent.</text>
  <text x="255" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">Rent: ≈ $4–6 / month</text>

  <!-- B2: opposite bet -->
  <rect x="530" y="228" width="350" height="122" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="705" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">② Hold an equal OPPOSITE bet, per coin</text>
  <text x="705" y="280" text-anchor="middle" font-size="13" fill="#334155">Coin drops $100 → bet pays you $100 back.</text>
  <text x="705" y="300" text-anchor="middle" font-size="13" fill="#334155">Coin rises $100 → your coin gains $100.</text>
  <text x="705" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">Bonus: gamblers pay this bet ≈ $4–5 / month</text>

  <!-- cancel badge -->
  <circle cx="480" cy="289" r="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">price risk</text>
  <text x="480" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">CANCELS</text>
  <line x1="432" y1="289" x2="440" y2="289" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="439,283 439,295 447,289" fill="#94a3b8"/>
  <line x1="528" y1="289" x2="520" y2="289" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="521,283 521,295 513,289" fill="#94a3b8"/>

  <!-- arrows into crash strip -->
  <line x1="255" y1="350" x2="255" y2="364" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="249,363 261,363 255,371" fill="#94a3b8"/>
  <line x1="705" y1="350" x2="705" y2="364" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="699,363 711,363 705,371" fill="#94a3b8"/>

  <!-- crash strip -->
  <rect x="80" y="371" width="800" height="58" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="480" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Crypto crashes 30%? Coins lose $600, bets win $600 back. Total doesn't move.</text>
  <text x="480" y="416" text-anchor="middle" font-size="13" fill="#b91c1c">15 weeks of real-rate testing: 0 losing weeks. Worst week was still positive.</text>

  <!-- arrow to income -->
  <line x1="480" y1="429" x2="480" y2="450" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="472,449 488,449 480,461" fill="#16a34a"/>

  <!-- income box -->
  <rect x="180" y="461" width="600" height="78" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="492" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">Money in: ≈ $9–10 / month on $2,000</text>
  <text x="480" y="516" text-anchor="middle" font-size="13" fill="#15803d">Paid by borrowers (rent) + over-excited buyers (fees). You still own the coins.</text>

  <!-- optional add-on -->
  <rect x="180" y="551" width="600" height="54" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="572" text-anchor="middle" font-size="13.5" font-weight="600" fill="#92400e">Optional later: two tiny auto-traders on top → ≈ $25–30 / month total</text>
  <text x="480" y="592" text-anchor="middle" font-size="12" fill="#b45309">they wobble a little — worst week measured: −$1.80</text>

  <!-- footer -->
  <text x="480" y="634" text-anchor="middle" font-size="13" fill="#475569">Your job: a 10-minute check once a month. Real risk: the exchange itself — only money you could survive losing.</text>
</svg>
